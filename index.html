<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murfs and Murfery</title>
<style>
  :root {
    --bg: #14100d;
    --panel: #241c16;
    --panel-border: #4a3a28;
    --text: #f1e6d2;
    --text-dim: #c9b896;
    --accent: #caa15d;
    --accent-dim: #8a6d1f;
    --danger: #b23a3a;
    --danger-bg: #f1ddd4;
    --danger-text-dim: #7a4a42;
    --penalty-empty: #4a2b2b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
  }

  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
  }

  h1.title {
    text-align: center;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 4px 0 16px;
  }

  /* ---- HUD ---- */
  #hud {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }

  .hud-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .progress-wrap {
    flex: 1;
  }

  .progress-track {
    position: relative;
    background: #100c09;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.4s ease;
  }

  .zone-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--text);
    opacity: 0.55;
  }

  .penalty-points {
    font-size: 2rem;
    white-space: nowrap;
    letter-spacing: 2px;
  }

  .penalty-mark-full { color: var(--danger); }
  .penalty-mark-empty { color: var(--penalty-empty); }


  /* ---- Scene (scrolling adventure feed) ---- */
  #scene {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    max-height: 68vh;
    scroll-behavior: smooth;
    margin-bottom: 16px;
    scrollbar-width: auto;
    scrollbar-color: var(--accent-dim) #100c09;
  }

  #scene::-webkit-scrollbar {
    width: 16px;
  }

  #scene::-webkit-scrollbar-track {
    background: #100c09;
    border-radius: 999px;
  }

  #scene::-webkit-scrollbar-thumb {
    background-color: var(--accent-dim);
    background-clip: padding-box;
    border: 4px solid var(--panel);
    border-radius: 999px;
  }

  #scene::-webkit-scrollbar-thumb:hover {
    background-color: var(--accent);
  }

  #scene-feed {
    display: flex;
    flex-direction: column;
  }

  .location-entry + .location-entry {
    border-top: 1px dashed var(--accent-dim);
    margin-top: 48px;
    padding-top: 48px;
  }

  .entry-image {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #100c09;
  }

  .entry-body {
    padding: 16px;
  }

  .entry-name {
    margin: 0 0 8px;
    font-size: 1.2rem;
    color: var(--accent);
  }

  .entry-description {
    margin: 0 0 16px;
    line-height: 1.5;
    color: var(--text);
  }

  .entry-choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .choice-btn {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #1c150f;
    border: 1px solid var(--accent-dim);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 14px;
    border-radius: 6px;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .choice-btn:hover {
    background: #2a2018;
    border-color: var(--accent);
  }

  .choice-btn:disabled {
    cursor: default;
  }

  .choice-label {
    position: relative;
  }

  .choice-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: rgba(202, 161, 93, 0.35);
    transition: width 0.5s linear;
  }

  .choice-fill.choice-fill-active {
    width: 100%;
  }

  .choice-btn.choice-selected {
    border-width: 3px;
    border-color: var(--accent);
  }

  .choice-btn.poofo-highlight {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim) inset;
  }

  .poofo-icon {
    display: inline-flex;
    flex-shrink: 0;
    color: var(--accent);
  }

  .poofo-icon svg {
    display: block;
  }

  .entry-poofo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 14px;
    text-align: center;
  }

  .poofo-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: transparent;
    border: 1px dashed var(--accent-dim);
    color: var(--accent);
    font-family: inherit;
    font-style: italic;
    font-size: 0.9rem;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }

  .poofo-btn:hover {
    border-color: var(--accent);
  }

  .poofo-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .poofo-hint {
    font-style: italic;
    color: var(--accent);
    font-size: 0.9rem;
    margin: 6px 0 0;
  }

  /* ---- Inline choice consequence ---- */
  .consequence {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--accent-dim);
    text-align: center;
  }

  /* Penalty/game-over messages get a lightened box instead of sitting
     directly on the dark panel, since --danger red has poor contrast
     against the dark brown background. */
  .consequence-box-penalty,
  .consequence-box-gameover {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .consequence-image {
    display: block;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 6px;
    margin: 0 auto 12px;
  }

  .consequence-message {
    color: var(--text-dim);
    margin: 0 0 6px;
    line-height: 1.5;
  }

  .consequence-box-penalty .consequence-message,
  .consequence-box-gameover .consequence-message {
    color: var(--danger);
    font-weight: bold;
  }

  .consequence-detail {
    font-style: italic;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin: 0 0 14px;
  }

  .consequence-box-penalty .consequence-detail,
  .consequence-box-gameover .consequence-detail {
    color: var(--danger-text-dim);
  }

  /* "Travelling ... N miles" always renders below/outside the penalty box
     (it's a sibling of .consequence-box, not a child), with generous
     space above it and left-justified rather than centered. */
  .travel-status {
    margin-top: 28px;
    text-align: left;
  }

  /* Dot slots are always present (reserving their width) and just toggle
     visibility, so "Travelling" never shifts position as the ellipsis
     fills in. */
  .travel-dot {
    opacity: 0;
  }

  .travel-dot.travel-dot-visible {
    opacity: 1;
  }

  /* ---- Inline zone-transition (appears directly in the scrolling feed,
     demarcated with generous vertical spacing + a double "===" divider,
     instead of a modal) ---- */
  .zone-transition {
    margin: 64px 0;
    text-align: center;
  }

  .zone-divider {
    font-family: 'Courier New', monospace;
    color: var(--accent-dim);
    line-height: 1.4;
    letter-spacing: 2px;
    overflow: hidden;
    white-space: nowrap;
  }

  .zone-transition-title {
    color: var(--accent);
    margin: 16px 0 8px;
    font-size: 1.2rem;
  }

  .zone-transition-message {
    color: var(--text-dim);
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .zone-transition-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .zone-transition-actions .primary-btn {
    flex: 1;
    min-width: 140px;
  }

  .zone-transition-choice {
    margin-top: 12px;
    font-style: italic;
    color: var(--text-dim);
  }

  /* ---- End entry (win/game-over, rendered as a location entry) ---- */
  .end-entry {
    text-align: center;
  }

  .end-entry .entry-description {
    margin-bottom: 20px;
  }

  .primary-btn {
    background: var(--accent);
    color: #1b1410;
    border: none;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
  }

  .primary-btn:hover {
    background: #e0b96e;
  }

  .primary-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <h1 class="title">Murfs and Murfery</h1>

  <div id="hud">

      <div class="progress-wrap">

          <div id="zone-markers"></div>
        </div>
      </div>
      <div class="penalty-points" id="penalty-points"></div>
    </div>
  </div>
</div>

   Everything in this section is placeholder content meant to be replaced.

  minTravel: 4,      // min distance gained per action
  maxTravel: 6,      // max distance gained per action
  poofoAppearChance: 0.5 // odds the "Consult the local Poofo" option shows up at a location
};

// The journey is divided into three zones by progress. Each location
// belongs to exactly one zone (see LOCATIONS below), and only locations in
// the player's current zone are eligible to be picked next. Boundaries are
// also drawn as markers on the progress bar.
const ZONES = [
  { id: 1, name: 'a new area', min: 0, max: 19 },
  { id: 2, name: 'a new area', min: 20, max: 36 },
  { id: 3, name: 'a new area', min: 37, max: 52 },

// (weighted by optional `weight`, default 1 if omitted), and `accuracy` is
// the probability that Poofo ends up highlighting the location's actual
// "correct" choice (see getCorrectChoice below) rather than a random wrong
// one. Edit text/accuracy/weight freely, and add or remove entries.
const POOFO_HINTS = [
  { text: 'The Poofo seems sure of himself.', accuracy: 0.9 },
  { text: 'The Poofo mumbles something, but you\'re not sure if he\'s awake.', accuracy: 0.5 },
  { text: 'The Poofo gives advice, but seems more interested in his off-track betting app.', accuracy: 0.1 },
  { text: 'The Poofo mutters advice, but is mostly busy checking his crypto portFOlio.', accuracy: 0.1 },

// Each choice has a single, fixed outcome (no randomness in *what*
// happens — only *how far* the player travels stays random). outcome.type
// is one of:
//   'normal'   -> flavor text only
//   'penalty'  -> gain 1 penalty point (a red X); 3 points ends the game
//   'heal'     -> remove 1 penalty point (floor of 0)
//   'gameover' -> quest ends immediately, regardless of penalty points
// outcome.text is shown inline, right in the scrolling feed, after the
// choice is made.

// The player always starts here, before any zone locations. It has no
// `zone` and lives outside LOCATIONS, so it's never picked by the normal
// zone-based selection (pickNextLocation) — newGame() always sends the
// player here first.

    { label: 'Begin', outcome: { type: 'normal', text: 'You start walking' } },

      { label: 'Go for the Vatch tug', outcome: { type: 'penalty', text: '<<shred shred>>' } },
      { label: 'Grab an extra point', outcome: { type: 'penalty', text: 'You fail to secure the hippo, and lose the game' } },
      { label: '"Death grip on the hippo"', outcome: { type: 'normal', text: 'Big score!!!' } },
    ],
  },
  {
    id: 'loc_jnGolf', name: 'JN Golf', image: 'images/loc_jnGolf.png',
    description: 'You are challenged to a game of Jack Nicklaus golf.  The computer looks very old.  You need to pick a course...',
    zone: 3, weight: 1,
    choices: [
      { label: 'Choose Castle Pines', outcome: { type: 'normal', text: 'What a shot!' } },
      { label: 'Choose St. Andrews', outcome: { type: 'penalty', text: 'AUCK!! That\'s not a JN Golf course!!' } },
      { label: 'Choose Desert Mountain', outcome: { type: 'normal', text: 'A golf legend!' } },
    ],
  },
  
  {
    id: 'loc_theTennisCourts', name: 'the Tennis courts', image: 'images/loc_tennisCourts.jpeg',
    description: 'A tennis match is in full swing.  Several hard-fought points end with questionable calls.  You contemplate getting involved...',
    zone: 3, weight: 1,
    choices: [
      { label: 'Keep your opinions to yourself', outcome: { type: 'normal', text: 'Gallant would approve.  You journey onward.' } },
      { label: 'Inquire at the replay booth', outcome: { type: 'gameover', text: 'YEETTTIIIIIIIIIIIIII!!!!!!!   Thanks for coming up!', image: 'images/yetiBig.jpeg' } },
    ],
  },
];

const END_TEXT = {
  win: {
    title: 'The Striped Poofo!!!!',
    goodMessage: 'You found it!  At last your quest is at an end.  You retire to a life of luxury.',
    badMessage: 'You at last reach the mythical Striped Poofo.  Unfortunately, as you publicize your discovery, your assets are confiscated for fraudulent crypto activity. You retire to a life of poverty',
    image: 'images/stripedPoofo.JPG',
  },
  gameover: {
    title: 'Game over',
    message: 'Try Vatching it next time',
    image: 'images/gameover.jpeg',
  },
};

/* =========================================================================
   ENGINE SECTION
   ---------------------------------------------------------------------
   Game state and logic. Shouldn't need to change this to edit content.
   ========================================================================= */

// Frequently-used DOM anchors, looked up once.
const sceneEl = document.getElementById('scene');
const sceneFeedEl = document.getElementById('scene-feed');
const progressFillEl = document.getElementById('progress-fill');
const penaltyPointsEl = document.getElementById('penalty-points');
const zoneMarkersEl = document.getElementById('zone-markers');

// Creates an element, optionally setting its className and textContent.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function img(className, src, alt) {
  const node = el('img', className);
  node.src = src;
  node.alt = alt;
  return node;
}

// Builds the "image, title, description" card shared by location entries,
// end screens, and the debug outcome-image gallery. Callers append
// whatever else belongs in the body (choices, buttons, ...).
function buildEntryCard(entryClassName, imageSrc, imageAlt, title, description) {
  const entry = el('div', entryClassName);
  entry.appendChild(img('entry-image', imageSrc, imageAlt));

  const body = el('div', 'entry-body');
  body.appendChild(el('h2', 'entry-name', title));
  body.appendChild(el('p', 'entry-description', description));
  entry.appendChild(body);

  return { entry, body };
}

let state;

// Debug mode (?debug=true in the URL) dumps every location plus both end
// screens into the feed on load, so all the artwork can be eyeballed at
// once without playing through the whole game.
function isDebugMode() {
  return new URLSearchParams(window.location.search).get('debug') === 'true';
}

function newGame() {
  // The game always starts at the predefined intro location, not a random
  // zone-1 location.
  state = {
    progress: 0,
    penaltyPoints: 0,
    currentLocationId: INTRO_LOCATION.id,
    visited: new Set([INTRO_LOCATION.id]),
    ended: false,
    gaveCrypto: false,
  };
  sceneFeedEl.innerHTML = '';
  appendLocationEntry(INTRO_LOCATION);
  updateHud();

  if (isDebugMode()) {
    appendDebugGallery();
  }
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pickWeighted(items, weightFn) {
  const total = items.reduce((sum, item) => sum + weightFn(item), 0);
  let roll = Math.random() * total;
  for (const item of items) {
    roll -= weightFn(item);
    if (roll <= 0) return item;
  }
  return items[items.length - 1];
}

function getZoneForProgress(progress) {
  return ZONES.find(z => progress >= z.min && progress <= z.max) || ZONES[ZONES.length - 1];
}

function pickNextLocation(excludeId) {
  const zone = getZoneForProgress(state.progress);
  const zoneLocations = LOCATIONS.filter(loc => loc.zone === zone.id);

  // Prefer locations in this zone the player hasn't seen yet.
  let eligible = zoneLocations.filter(loc => !state.visited.has(loc.id));
  if (eligible.length === 0) {
    // Every location in this zone has already been visited. Repeating one
    // is unavoidable at that point, but still avoid an immediate repeat of
    // the current room if there's any other option.
    eligible = zoneLocations;
    if (eligible.length > 1 && excludeId) {
      const withoutCurrent = eligible.filter(l => l.id !== excludeId);
      if (withoutCurrent.length > 0) eligible = withoutCurrent;
    }
  }
  if (eligible.length === 0) {
    // Fallback in case a zone has no locations defined at all.
    eligible = LOCATIONS;
  }
  return pickWeighted(eligible, l => l.weight);
}

// Desirability ranking of outcome types, best first. Used by
// getCorrectChoice to pick the "best" choice at a location automatically.
const OUTCOME_RANK = { heal: 3, normal: 2, penalty: 1, gameover: 0 };

// Determines which choice at a location counts as "correct" for Poofo's
// purposes. A choice can be marked explicitly with `poofoCorrect: true`;
// otherwise the choice with the most desirable determined outcome type
// (see OUTCOME_RANK) wins.
function getCorrectChoice(location) {
  const explicit = location.choices.find(c => c.poofoCorrect);
  if (explicit) return explicit;

  let best = location.choices[0];
  let bestRank = -Infinity;
  location.choices.forEach(choice => {
    const rank = OUTCOME_RANK[choice.outcome.type] ?? 0;
    if (rank > bestRank) {
      bestRank = rank;
      best = choice;
    }
  });
  return best;
}

function resolveChoice(choice, entryEl) {
  if (state.ended) return;

  const distance = randomInt(CONFIG.minTravel, CONFIG.maxTravel);
  const outcome = choice.outcome;
  const prevZone = getZoneForProgress(state.progress);

  state.progress = Math.min(state.progress + distance, CONFIG.winDistance);

  if (outcome.type === 'penalty') {
    state.penaltyPoints += 1;
  } else if (outcome.type === 'heal') {
    state.penaltyPoints = Math.max(state.penaltyPoints - 1, 0);
  }

  // The progress bar itself shouldn't move until whatever comes next
  // (the next location, a zone transition, or an end screen) actually
  // appears, so only the penalty marks update here.
  updatePenaltyHud();

  appendConsequence(entryEl, outcome, distance, () => {
    updateProgressBar();

    if (outcome.type === 'gameover') {
      // The choice's own flavor text was already shown inline via
      // appendConsequence just above; the end screen itself should show
      // the game's overall defeat message (END_TEXT.gameover.message),
      // not a repeat of that same choice text.
      endGame('gameover');
      return;
    }
    if (state.penaltyPoints >= CONFIG.maxPenaltyPoints) {
      endGame('gameover', 'Too many penalty points--try vatching it instead.  Rrrr....');
      return;
    }
    if (state.progress >= CONFIG.winDistance) {
      endGame('win', state.gaveCrypto ? END_TEXT.win.badMessage : END_TEXT.win.goodMessage);
      return;
    }

    const next = pickNextLocation(state.currentLocationId);
    state.currentLocationId = next.id;
    state.visited.add(next.id);

    const newZone = getZoneForProgress(state.progress);
    if (newZone.id !== prevZone.id) {
      appendZoneTransitionEntry(newZone, () => appendLocationEntry(next));
    } else {
      appendLocationEntry(next);
    }
  });
}

// Appends the outcome text (plus a penalty detail line) and a Continue
// button right into the location entry the player just chose from,
// instead of a modal. Continuing (for any non-gameover outcome) plays the
// "You travel N miles..." status via playTravelStatus before running
// onContinue; a gameover outcome runs onContinue immediately.
function appendConsequence(entryEl, outcome, distance, onContinue) {
  const body = entryEl.querySelector('.entry-body');

  const consequence = el('div', 'consequence');

  // The message/detail/button live in their own box so that a later
  // appended "You travel N miles..." status (a sibling of this box, not a
  // child of it) renders below/outside the penalty highlight instead of
  // inside it.
  const box = el('div', 'consequence-box consequence-box-' + outcome.type);
  consequence.appendChild(box);

  if (outcome.image) {
    box.appendChild(img('consequence-image', outcome.image, outcome.text));
  }

  box.appendChild(el('p', 'consequence-message', outcome.text));

  if (outcome.type === 'penalty') {
    box.appendChild(el('p', 'consequence-detail', "(that's a penalty point)"));
  }

  const continueBtn = el('button', 'primary-btn', outcome.type === 'gameover' ? 'Game Over' : 'Continue');
  continueBtn.addEventListener('click', () => {
    continueBtn.disabled = true;

    if (outcome.type === 'gameover') {
      onContinue();
      return;
    }

    continueBtn.remove();
    playTravelStatus(consequence, distance, onContinue);
  });
  box.appendChild(continueBtn);

  body.appendChild(consequence);
  scrollFeedToBottom();
}

// "Travelling ..." plays first, dots filling in quickly. Once
// MILES_REVEAL_DELAY_MS has passed, " N miles" is appended to the end: the
// full text then lingers for TRAVEL_LINGER_MS before onDone runs.
const DOT_COUNT = 6;
const DOT_INTERVAL_MS = 150;
const MILES_REVEAL_DELAY_MS = 1500;
const TRAVEL_LINGER_MS = 500;

function playTravelStatus(container, distance, onDone) {
  const statusEl = el('p', 'consequence-detail travel-status');
  statusEl.appendChild(el('span', null, 'Travelling'));

  // All dot slots are rendered (and take up their layout space) from the
  // start, just invisible — that way the reserved width never changes as
  // dots turn on, so the label doesn't recenter/shift mid-animation.
  const dotEls = [];
  for (let i = 0; i < DOT_COUNT; i++) {
    const dot = el('span', 'travel-dot', '.');
    statusEl.appendChild(dot);
    dotEls.push(dot);
  }

  const milesEl = el('span');
  statusEl.appendChild(milesEl);

  container.appendChild(statusEl);
  scrollFeedToBottom();

  let shown = 0;
  const dotTimer = setInterval(() => {
    if (shown < dotEls.length) {
      dotEls[shown].classList.add('travel-dot-visible');
      shown += 1;
    } else {
      clearInterval(dotTimer);
    }
  }, DOT_INTERVAL_MS);

  setTimeout(() => {
    milesEl.textContent = ` ${distance} miles`;
    scrollFeedToBottom();
  }, MILES_REVEAL_DELAY_MS);

  setTimeout(() => {
    clearInterval(dotTimer);
    onDone();
  }, MILES_REVEAL_DELAY_MS + TRAVEL_LINGER_MS);
}

// Shown once whenever the player's progress crosses into a new zone.
// Purely flavor for now (a gold prompt from the zone's Poofo) — the choice
// has no gameplay effect yet, beyond being remembered for the win text.
// Rendered directly into the scrolling feed (rather than a modal),
// demarcated with generous vertical spacing and a double "===" divider.
function appendZoneTransitionEntry(zone, onContinue) {
  const divider = '='.repeat(48);

  const entry = el('div', 'zone-transition');

  [1, 2].forEach(() => {
    entry.appendChild(el('div', 'zone-divider', divider));
  });

  entry.appendChild(el('h2', 'zone-transition-title', 'Entering new territory'));
  entry.appendChild(el('p', 'zone-transition-message',
    'A beep on your FoFynder app indicates you are now in a different Local Poofo area.'));

  const actions = el('div', 'zone-transition-actions');
  entry.appendChild(actions);

  const largeBtn = el('button', 'primary-btn', 'Send crypto to the local Poofo');
  const smallBtn = el('button', 'primary-btn', 'Say an oath');
  actions.appendChild(largeBtn);
  actions.appendChild(smallBtn);

  sceneFeedEl.appendChild(entry);
  scrollFeedToBottom();

  function choose(buttonEl) {
    largeBtn.disabled = true;
    smallBtn.disabled = true;

    entry.appendChild(el('p', 'zone-transition-choice', `You chose: ${buttonEl.textContent}`));

    scrollFeedToBottom();
    onContinue();
  }

  largeBtn.addEventListener('click', () => { state.gaveCrypto = true; choose(largeBtn); });
  smallBtn.addEventListener('click', () => choose(smallBtn));
}

function endGame(type, message) {
  state.ended = true;
  appendEndEntry(type, message);
}

/* ---- Rendering ---- */

function scrollFeedToBottom() {
  sceneEl.scrollTop = sceneEl.scrollHeight;
}

// Appends a new location card (image, name, description, choices, Poofo)
// to the bottom of the scrolling feed.
function appendLocationEntry(location) {
  const { entry, body } = buildEntryCard('location-entry', location.image, location.name,
    location.name, location.description);

  const choicesEl = el('div', 'entry-choices');
  body.appendChild(choicesEl);

  const poofoEl = el('div', 'entry-poofo hidden');
  body.appendChild(poofoEl);

  sceneFeedEl.appendChild(entry);

  const buttonMap = new Map();
  location.choices.forEach(choice => {
    const btn = el('button', 'choice-btn');
    btn.appendChild(el('span', 'choice-label', choice.label));
    btn.appendChild(el('span', 'choice-fill'));
    btn.addEventListener('click', () => selectChoice(choice, btn, buttonMap, entry));
    choicesEl.appendChild(btn);
    buttonMap.set(choice, btn);
  });

  renderPoofo(location, buttonMap, poofoEl);
  scrollFeedToBottom();
}

// Appends the win/game-over result to the bottom of the feed, styled like
// a location entry (image, title, message) but with a "Play Again" button
// in place of choices, so the player's full journey stays visible above it.
function appendEndEntry(type, message) {
  const info = END_TEXT[type];
  const { entry, body } = buildEntryCard('location-entry end-entry', info.image, info.title,
    info.title, message || info.message);

  const restartBtn = el('button', 'primary-btn', 'Play Again');
  restartBtn.addEventListener('click', newGame);
  body.appendChild(restartBtn);

  sceneFeedEl.appendChild(entry);
  scrollFeedToBottom();
}

// Appends every location plus both end screens right after the intro, so
// every image can be reviewed in one scroll. See isDebugMode above.
function appendDebugGallery() {
  LOCATIONS.forEach(appendLocationEntry);
  appendEndEntry('win', END_TEXT.win.goodMessage);
  appendEndEntry('gameover', END_TEXT.gameover.message);
  appendOutcomeImageGallery();
}

// Appends one entry per choice outcome that has its own image, so those
// (e.g. a gameover twist image) can be eyeballed alongside the location
// and end-screen artwork above.
function appendOutcomeImageGallery() {
  LOCATIONS.forEach(location => {
    location.choices.forEach(choice => {
      const outcome = choice.outcome;
      if (!outcome.image) return;

      const { entry } = buildEntryCard('location-entry', outcome.image, outcome.text,
        location.name + ' — ' + choice.label, outcome.text);
      sceneFeedEl.appendChild(entry);
    });
  });
}

// How long the pulse + fill-bar animation plays before the consequence
// (and any state changes) actually appears.
const CHOICE_SELECT_ANIMATION_MS = 500;

// Plays the "selected" visual (thicker border + fill bar sweeping across
// the button) on the clicked choice, locks out further input in this
// entry, then resolves the choice once the animation has finished.
function selectChoice(choice, btn, buttonMap, entryEl) {
  if (state.ended || btn.disabled) return;

  buttonMap.forEach(b => { b.disabled = true; });
  const poofoBtn = entryEl.querySelector('.poofo-btn');
  if (poofoBtn) poofoBtn.disabled = true;

  btn.classList.add('choice-selected');
  const fill = btn.querySelector('.choice-fill');
  if (fill) fill.classList.add('choice-fill-active');

  setTimeout(() => resolveChoice(choice, entryEl), CHOICE_SELECT_ANIMATION_MS);
}

// Small inline icon marking Poofo's recommended choice.
const POOFO_ICON_SVG = `
<svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
  <circle cx="6" cy="6" r="3" fill="currentColor"/>
  <circle cx="18" cy="6" r="3" fill="currentColor"/>
  <circle cx="12" cy="13" r="8" fill="currentColor"/>
  <circle cx="9" cy="11" r="1.1" fill="#1b1410"/>
  <circle cx="15" cy="11" r="1.1" fill="#1b1410"/>
  <ellipse cx="12" cy="15" rx="3.5" ry="2.5" fill="#1b1410"/>
  <circle cx="12" cy="15" r="0.8" fill="currentColor"/>
</svg>`.trim();

function makePoofoIcon() {
  const icon = el('span', 'poofo-icon');
  icon.innerHTML = POOFO_ICON_SVG;
  return icon;
}

function renderPoofo(location, buttonMap, poofoEl) {
  poofoEl.innerHTML = '';
  poofoEl.classList.add('hidden');

  if (location.choices.length < 2) return;
  if (Math.random() >= CONFIG.poofoAppearChance) return;

  poofoEl.classList.remove('hidden');

  const btn = el('button', 'poofo-btn');
  btn.appendChild(el('span', null, 'Consult the local Poofo'));
  btn.appendChild(makePoofoIcon());

  const hintText = el('p', 'poofo-hint');

  btn.addEventListener('click', () => {
    const hint = pickWeighted(POOFO_HINTS, h => h.weight || 1);
    const correct = getCorrectChoice(location);
    const isAccurate = Math.random() < hint.accuracy;

    let highlighted = correct;
    if (!isAccurate) {
      const others = location.choices.filter(c => c !== correct);
      if (others.length > 0) highlighted = others[randomInt(0, others.length - 1)];
    }

    hintText.textContent = hint.text;
    buttonMap.forEach(buttonEl => {
      buttonEl.classList.remove('poofo-highlight');
      const existingIcon = buttonEl.querySelector('.poofo-icon');
      if (existingIcon) existingIcon.remove();
    });
    const targetBtn = buttonMap.get(highlighted);
    if (targetBtn) {
      targetBtn.classList.add('poofo-highlight');
      targetBtn.appendChild(makePoofoIcon());
    }
    btn.disabled = true;
  });

  poofoEl.appendChild(btn);
  poofoEl.appendChild(hintText);
}

// Draws a tick on the progress bar at the start of each zone after the
// first (zone boundaries never move, so this only needs to run once).
function renderZoneMarkers() {
  zoneMarkersEl.innerHTML = '';
  ZONES.slice(1).forEach(zone => {
    const marker = el('div', 'zone-marker');
    marker.style.left = (zone.min / CONFIG.winDistance) * 100 + '%';
    marker.title = `${zone.name} begins`;
    zoneMarkersEl.appendChild(marker);
  });
}

function updateProgressBar() {
  const pct = Math.min(100, (state.progress / CONFIG.winDistance) * 100);
  progressFillEl.style.width = pct + '%';
}

function updatePenaltyHud() {
  penaltyPointsEl.innerHTML = '';
  for (let i = 0; i < CONFIG.maxPenaltyPoints; i++) {
    const className = i < state.penaltyPoints ? 'penalty-mark-full' : 'penalty-mark-empty';
    penaltyPointsEl.appendChild(el('span', className, '✗'));
  }
}

function updateHud() {
  updateProgressBar();
  updatePenaltyHud();
}

renderZoneMarkers();
newGame();
</script>
