<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murfs and Murfery</title>
<style>
  :root {
    --bg: #14100d;
    --panel: #241c16;
    --panel-border: #4a3a28;
    --text: #f1e6d2;
    --text-dim: #c9b896;
    --accent: #caa15d;
    --accent-dim: #8a6d1f;
    --danger: #b23a3a;
    --danger-bg: #f1ddd4;
    --danger-text-dim: #7a4a42;
    --penalty-empty: #4a2b2b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
  }

  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
  }

  h1.title {
    text-align: center;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 4px 0 16px;
  }

  /* ---- HUD ---- */
  #hud {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }

  .hud-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .progress-wrap {
    flex: 1;
  }

  .progress-track {
    position: relative;
    background: #100c09;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.4s ease;
  }

  .zone-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--text);
    opacity: 0.55;
  }

  .penalty-points {
    font-size: 2rem;
    white-space: nowrap;
    letter-spacing: 2px;
  }

  .penalty-mark-full { color: var(--danger); }
  .penalty-mark-empty { color: var(--penalty-empty); }


  /* ---- Scene (scrolling adventure feed) ---- */
  #scene {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    max-height: 68vh;
    scroll-behavior: smooth;
    margin-bottom: 16px;
    scrollbar-width: auto;
    scrollbar-color: var(--accent-dim) #100c09;
  }

  #scene::-webkit-scrollbar {
    width: 16px;
  }

  #scene::-webkit-scrollbar-track {
    background: #100c09;
    border-radius: 999px;
  }

  #scene::-webkit-scrollbar-thumb {
    background-color: var(--accent-dim);
    background-clip: padding-box;
    border: 4px solid var(--panel);
    border-radius: 999px;
  }

  #scene::-webkit-scrollbar-thumb:hover {
    background-color: var(--accent);
  }

  #scene-feed {
    display: flex;
    flex-direction: column;
  }

  .location-entry + .location-entry {
    border-top: 1px dashed var(--accent-dim);
    margin-top: 48px;
    padding-top: 48px;
  }

  .entry-image {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #100c09;
  }

  .entry-body {
    padding: 16px;
  }

  .entry-name {
    margin: 0 0 8px;
    font-size: 1.2rem;
    color: var(--accent);
  }

  .entry-description {
    margin: 0 0 16px;
    line-height: 1.5;
    color: var(--text);
  }

  .entry-choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .choice-btn {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #1c150f;
    border: 1px solid var(--accent-dim);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 14px;
    border-radius: 6px;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .choice-btn:hover {
    background: #2a2018;
    border-color: var(--accent);
  }

  .choice-btn:disabled {
    cursor: default;
  }

  .choice-label {
    position: relative;
  }

  .choice-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: rgba(202, 161, 93, 0.35);
    transition: width 1s linear;
  }

  .choice-fill.choice-fill-active {
    width: 100%;
  }

  .choice-btn.choice-selected {
    border-width: 3px;
    border-color: var(--accent);
  }

  .choice-btn.poofo-highlight {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim) inset;
  }

  .poofo-icon {
    display: inline-flex;
    flex-shrink: 0;
    color: var(--accent);
  }

  .poofo-icon svg {
    display: block;
  }

  .entry-poofo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 14px;
    text-align: center;
  }

  .poofo-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: transparent;
    border: 1px dashed var(--accent-dim);
    color: var(--accent);
    font-family: inherit;
    font-style: italic;
    font-size: 0.9rem;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }

  .poofo-btn:hover {
    border-color: var(--accent);
  }

  .poofo-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .poofo-hint {
    font-style: italic;
    color: var(--accent);
    font-size: 0.9rem;
    margin: 6px 0 0;
  }

  /* ---- Inline choice consequence ---- */
  .consequence {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--accent-dim);
    text-align: center;
  }

  /* Penalty/game-over messages get a lightened box instead of sitting
     directly on the dark panel, since --danger red has poor contrast
     against the dark brown background. */
  .consequence.consequence-penalty,
  .consequence.consequence-gameover {
    border-top: none;
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .consequence-message {
    color: var(--text-dim);
    margin: 0 0 6px;
    line-height: 1.5;
  }

  .consequence.consequence-penalty .consequence-message,
  .consequence.consequence-gameover .consequence-message {
    color: var(--danger);
    font-weight: bold;
  }

  .consequence-detail {
    font-style: italic;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin: 0 0 14px;
  }

  .consequence.consequence-penalty .consequence-detail,
  .consequence.consequence-gameover .consequence-detail {
    color: var(--danger-text-dim);
  }

  /* ---- Inline zone-transition (appears directly in the scrolling feed,
     demarcated with generous vertical spacing + a double "===" divider,
     instead of a modal) ---- */
  .zone-transition {
    margin: 64px 0;
    text-align: center;
  }

  .zone-divider {
    font-family: 'Courier New', monospace;
    color: var(--accent-dim);
    line-height: 1.4;
    letter-spacing: 2px;
    overflow: hidden;
    white-space: nowrap;
  }

  .zone-transition-title {
    color: var(--accent);
    margin: 16px 0 8px;
    font-size: 1.2rem;
  }

  .zone-transition-message {
    color: var(--text-dim);
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .zone-transition-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .zone-transition-actions .primary-btn {
    flex: 1;
    min-width: 140px;
  }

  .zone-transition-choice {
    margin-top: 12px;
    font-style: italic;
    color: var(--text-dim);
  }

  /* ---- End entry (win/game-over, rendered as a location entry) ---- */
  .end-entry {
    text-align: center;
  }

  .end-entry .entry-description {
    margin-bottom: 20px;
  }

  .primary-btn {
    background: var(--accent);
    color: #1b1410;
    border: none;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
  }

  .primary-btn:hover {
    background: #e0b96e;
  }

  .primary-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .hidden { display: none !important; }
</style>
</head>

      </div>
      <div class="penalty-points" id="penalty-points"></div>
    </div>
  </div>
</div>

  minTravel: 1,      // min distance gained per action
  maxTravel: 3,      // max distance gained per action

// The journey is divided into three zones by progress. Each location

// also drawn as markers on the progress bar.

  { id: 1, name: 'a new area', min: 0, max: 9 },

// the probability that Poofo ends up highlighting the location's actual
// "correct" choice (see getCorrectChoice below) rather than a random wrong
// one. Edit text/accuracy/weight freely, and add or remove entries.
const POOFO_HINTS = [
  { text: 'The Poofo seems sure of himself.', accuracy: 0.9 },
  { text: 'The Poofo lazily dispenses some guidance.', accuracy: 0.8 },
  { text: 'The Poofo gives advice, but seems more interested in his off-track betting app.', accuracy: 0.1 },
  { text: 'The Poofo gives advice, but seems more interested in checking his crypto portfolio.', accuracy: 0.1 },

//   'normal'   -> flavor text only

// The player always starts here, before any zone locations. It has no
// `zone` and lives outside LOCATIONS, so it's never picked by the normal
// zone-based selection (pickNextLocation) — newGame() always sends the

      { label: 'Inquire at the replay booth', outcome: { type: 'gameover', text: 'YEETTTIIIIIIIIIIIIII!!!!!!!   Thanks for coming up!' } },
    ],
  },
];

const END_TEXT = {
  win: {
    title: 'The Striped Poofo!!!!',
    goodMessage: 'You found it!  At last your quest is at an end.  You retire to a life of luxury.',
    badMessage: 'You at last reach the mythical Striped Poofo.  Unfortunately, as you publicize your discovery, your assets are confiscated for fraudulent crypto activity. You retire to a life of poverty',
    image: 'images/stripedPoofo.JPG',
  },
  gameover: {
    title: 'Game over',
    message: 'Maybe try Vatching it next time',
    image: 'images/gameover.jpeg',
  },
};

/* =========================================================================
   ENGINE SECTION
   ---------------------------------------------------------------------
   Game state and logic. Shouldn't need to change this to edit content.
   ========================================================================= */

let state;

// Debug mode (?debug=true in the URL) dumps every location plus both end
// screens into the feed on load, so all the artwork can be eyeballed at
// once without playing through the whole game.
function isDebugMode() {
  return new URLSearchParams(window.location.search).get('debug') === 'true';
}

function newGame() {
  // The game always starts at the predefined intro location, not a random
  // zone-1 location.
  state = {
    progress: 0,
    penaltyPoints: 0,
    currentLocationId: INTRO_LOCATION.id,
    visited: new Set([INTRO_LOCATION.id]),
    ended: false,
    gaveCrypto: false,
  };
  document.getElementById('scene-feed').innerHTML = '';
  appendLocationEntry(INTRO_LOCATION);
  updateHud();

  if (isDebugMode()) {
    appendDebugGallery();
  }
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pickWeighted(items, weightFn) {
  const total = items.reduce((sum, item) => sum + weightFn(item), 0);
  let roll = Math.random() * total;
  for (const item of items) {
    roll -= weightFn(item);
    if (roll <= 0) return item;
  }
  return items[items.length - 1];
}

function getZoneForProgress(progress) {
  return ZONES.find(z => progress >= z.min && progress <= z.max) || ZONES[ZONES.length - 1];
}

function pickNextLocation(excludeId) {
  const zone = getZoneForProgress(state.progress);
  const zoneLocations = LOCATIONS.filter(loc => loc.zone === zone.id);

  // Prefer locations in this zone the player hasn't seen yet.
  let eligible = zoneLocations.filter(loc => !state.visited.has(loc.id));
  if (eligible.length === 0) {
    // Every location in this zone has already been visited. Repeating one
    // is unavoidable at that point, but still avoid an immediate repeat of
    // the current room if there's any other option.
    eligible = zoneLocations;
    if (eligible.length > 1 && excludeId) {
      const withoutCurrent = eligible.filter(l => l.id !== excludeId);
      if (withoutCurrent.length > 0) eligible = withoutCurrent;
    }
  }
  if (eligible.length === 0) {
    // Fallback in case a zone has no locations defined at all.
    eligible = LOCATIONS;
  }
  return pickWeighted(eligible, l => l.weight);
}

// Desirability ranking of outcome types, best first. Used by
// getCorrectChoice to pick the "best" choice at a location automatically.
const OUTCOME_RANK = { heal: 3, normal: 2, penalty: 1, gameover: 0 };

// Determines which choice at a location counts as "correct" for Poofo's
// purposes. A choice can be marked explicitly with `poofoCorrect: true`;
// otherwise the choice with the most desirable determined outcome type
// (see OUTCOME_RANK) wins.
function getCorrectChoice(location) {
  const explicit = location.choices.find(c => c.poofoCorrect);
  if (explicit) return explicit;

  let best = location.choices[0];
  let bestRank = -Infinity;
  location.choices.forEach(choice => {
    const rank = OUTCOME_RANK[choice.outcome.type] ?? 0;
    if (rank > bestRank) {
      bestRank = rank;
      best = choice;
    }
  });
  return best;
}

function resolveChoice(choice, entryEl) {
  if (state.ended) return;

  const distance = randomInt(CONFIG.minTravel, CONFIG.maxTravel);
  const outcome = choice.outcome;
  const prevZone = getZoneForProgress(state.progress);

  state.progress = Math.min(state.progress + distance, CONFIG.winDistance);

  if (outcome.type === 'penalty') {
    state.penaltyPoints += 1;
  } else if (outcome.type === 'heal') {
    state.penaltyPoints = Math.max(state.penaltyPoints - 1, 0);
  }

  updateHud();

  appendConsequence(entryEl, outcome, distance, () => {
    if (outcome.type === 'gameover') {
      // The choice's own flavor text was already shown inline via
      // appendConsequence just above; the end screen itself should show
      // the game's overall defeat message (END_TEXT.gameover.message),
      // not a repeat of that same choice text.
      endGame('gameover');
      return;
    }
    if (state.penaltyPoints >= CONFIG.maxPenaltyPoints) {
      endGame('gameover', 'Owwwh, rats.  That\'s too many penalty points.');
      return;
    }
    if (state.progress >= CONFIG.winDistance) {
      endGame('win', state.gaveCrypto ? END_TEXT.win.badMessage : END_TEXT.win.goodMessage);
      return;
    }

    const next = pickNextLocation(state.currentLocationId);
    state.currentLocationId = next.id;
    state.visited.add(next.id);

    const newZone = getZoneForProgress(state.progress);
    if (newZone.id !== prevZone.id) {
      appendZoneTransitionEntry(newZone, () => appendLocationEntry(next));
    } else {
      appendLocationEntry(next);
    }
  });
}

// Appends the outcome text (plus a penalty/travel detail line) and a
// Continue button right into the location entry the player just chose
// from, instead of a modal. Continuing runs onContinue.
function appendConsequence(entryEl, outcome, distance, onContinue) {
  const body = entryEl.querySelector('.entry-body');

  const consequence = document.createElement('div');
  consequence.className = 'consequence consequence-' + outcome.type;

  const message = document.createElement('p');
  message.className = 'consequence-message';
  message.textContent = outcome.text;
  consequence.appendChild(message);

  let detail = '';
  if (outcome.type === 'penalty') detail = "(that's a penalty point)";
  else if (outcome.type === 'normal') detail = `(you travel ${distance} miles)`;
  if (detail) {
    const detailEl = document.createElement('p');
    detailEl.className = 'consequence-detail';
    detailEl.textContent = detail;
    consequence.appendChild(detailEl);
  }

  const continueBtn = document.createElement('button');
  continueBtn.className = 'primary-btn';
  continueBtn.textContent = outcome.type === 'gameover' ? 'Game Over' : 'Continue';
  continueBtn.addEventListener('click', () => {
    continueBtn.disabled = true;
    onContinue();
  });
  consequence.appendChild(continueBtn);

  body.appendChild(consequence);
  scrollFeedToBottom();
}

// Shown once whenever the player's progress crosses into a new zone.
// Purely flavor for now (a gold prompt from the zone's Poofo) — the choice
// has no gameplay effect yet, beyond being remembered for the win text.
// Rendered directly into the scrolling feed (rather than a modal),
// demarcated with generous vertical spacing and a double "===" divider.
function appendZoneTransitionEntry(zone, onContinue) {
  const feed = document.getElementById('scene-feed');
  const divider = '='.repeat(48);

  const entry = document.createElement('div');
  entry.className = 'zone-transition';

  [1, 2].forEach(() => {
    const dividerLine = document.createElement('div');
    dividerLine.className = 'zone-divider';
    dividerLine.textContent = divider;
    entry.appendChild(dividerLine);
  });

  const title = document.createElement('h2');
  title.className = 'zone-transition-title';
  title.textContent = `You have entered ${zone.name}`;
  entry.appendChild(title);

  const message = document.createElement('p');
  message.className = 'zone-transition-message';
  message.textContent = 'A beep on your FoFynder app indicates you are now in a different Local Poofo area.';
  entry.appendChild(message);

  const actions = document.createElement('div');
  actions.className = 'zone-transition-actions';
  entry.appendChild(actions);

  const largeBtn = document.createElement('button');
  largeBtn.className = 'primary-btn';
  largeBtn.textContent = 'Send crypto to the local Poofo';
  const smallBtn = document.createElement('button');
  smallBtn.className = 'primary-btn';
  smallBtn.textContent = 'Say an oath';
  actions.appendChild(largeBtn);
  actions.appendChild(smallBtn);

  feed.appendChild(entry);
  scrollFeedToBottom();

  function choose(buttonEl) {
    largeBtn.disabled = true;
    smallBtn.disabled = true;

    const choiceEl = document.createElement('p');
    choiceEl.className = 'zone-transition-choice';
    choiceEl.textContent = `You chose: ${buttonEl.textContent}`;
    entry.appendChild(choiceEl);

    scrollFeedToBottom();
    onContinue();
  }

  largeBtn.addEventListener('click', () => { state.gaveCrypto = true; choose(largeBtn); });
  smallBtn.addEventListener('click', () => choose(smallBtn));
}

function endGame(type, message) {
  state.ended = true;
  appendEndEntry(type, message);
}

/* ---- Rendering ---- */

function scrollFeedToBottom() {
  const scene = document.getElementById('scene');
  scene.scrollTop = scene.scrollHeight;
}

// Appends a new location card (image, name, description, choices, Poofo)
// to the bottom of the scrolling feed.
function appendLocationEntry(location) {
  const feed = document.getElementById('scene-feed');

  const entry = document.createElement('div');
  entry.className = 'location-entry';

  const img = document.createElement('img');
  img.className = 'entry-image';
  img.src = location.image;
  img.alt = location.name;
  entry.appendChild(img);

  const body = document.createElement('div');
  body.className = 'entry-body';

  const name = document.createElement('h2');
  name.className = 'entry-name';
  name.textContent = location.name;
  body.appendChild(name);

  const description = document.createElement('p');
  description.className = 'entry-description';
  description.textContent = location.description;
  body.appendChild(description);

  const choicesEl = document.createElement('div');
  choicesEl.className = 'entry-choices';
  body.appendChild(choicesEl);

  const poofoEl = document.createElement('div');
  poofoEl.className = 'entry-poofo hidden';
  body.appendChild(poofoEl);

  entry.appendChild(body);
  feed.appendChild(entry);

  const buttonMap = new Map();
  location.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const label = document.createElement('span');
    label.className = 'choice-label';
    label.textContent = choice.label;
    const fill = document.createElement('span');
    fill.className = 'choice-fill';
    btn.appendChild(label);
    btn.appendChild(fill);
    btn.addEventListener('click', () => selectChoice(choice, btn, buttonMap, entry));
    choicesEl.appendChild(btn);
    buttonMap.set(choice, btn);
  });

  renderPoofo(location, buttonMap, poofoEl);
  scrollFeedToBottom();
}

// Appends the win/game-over result to the bottom of the feed, styled like
// a location entry (image, title, message) but with a "Play Again" button
// in place of choices, so the player's full journey stays visible above it.
function appendEndEntry(type, message) {
  const info = END_TEXT[type];
  const feed = document.getElementById('scene-feed');

  const entry = document.createElement('div');
  entry.className = 'location-entry end-entry';

  const img = document.createElement('img');
  img.className = 'entry-image';
  img.src = info.image;
  img.alt = info.title;
  entry.appendChild(img);

  const body = document.createElement('div');
  body.className = 'entry-body';

  const name = document.createElement('h2');
  name.className = 'entry-name';
  name.textContent = info.title;
  body.appendChild(name);

  const description = document.createElement('p');
  description.className = 'entry-description';
  description.textContent = message || info.message;
  body.appendChild(description);

  const restartBtn = document.createElement('button');
  restartBtn.className = 'primary-btn';
  restartBtn.textContent = 'Play Again';
  restartBtn.addEventListener('click', newGame);
  body.appendChild(restartBtn);

  entry.appendChild(body);
  feed.appendChild(entry);
  scrollFeedToBottom();
}

// Appends every location plus both end screens right after the intro, so
// every image can be reviewed in one scroll. See isDebugMode above.
function appendDebugGallery() {
  LOCATIONS.forEach(appendLocationEntry);
  appendEndEntry('win', END_TEXT.win.goodMessage);
  appendEndEntry('gameover', END_TEXT.gameover.message);
}

// How long the pulse + fill-bar animation plays before the consequence
// (and any state changes) actually appears.
const CHOICE_SELECT_ANIMATION_MS = 1000;

// Plays the "selected" visual (thicker border + fill bar sweeping across
// the button) on the clicked choice, locks out further input in this
// entry, then resolves the choice once the animation has finished.
function selectChoice(choice, btn, buttonMap, entryEl) {
  if (state.ended || btn.disabled) return;

  buttonMap.forEach(b => { b.disabled = true; });
  const poofoBtn = entryEl.querySelector('.poofo-btn');
  if (poofoBtn) poofoBtn.disabled = true;

  btn.classList.add('choice-selected');
  const fill = btn.querySelector('.choice-fill');
  if (fill) fill.classList.add('choice-fill-active');

  setTimeout(() => resolveChoice(choice, entryEl), CHOICE_SELECT_ANIMATION_MS);
}

// Small inline icon marking Poofo's recommended choice.
const POOFO_ICON_SVG = `
<svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
  <circle cx="6" cy="6" r="3" fill="currentColor"/>
  <circle cx="18" cy="6" r="3" fill="currentColor"/>
  <circle cx="12" cy="13" r="8" fill="currentColor"/>
  <circle cx="9" cy="11" r="1.1" fill="#1b1410"/>
  <circle cx="15" cy="11" r="1.1" fill="#1b1410"/>
  <ellipse cx="12" cy="15" rx="3.5" ry="2.5" fill="#1b1410"/>
  <circle cx="12" cy="15" r="0.8" fill="currentColor"/>
</svg>`.trim();

function renderPoofo(location, buttonMap, poofoEl) {
  poofoEl.innerHTML = '';
  poofoEl.classList.add('hidden');

  if (location.choices.length < 2) return;
  if (Math.random() >= CONFIG.poofoAppearChance) return;

  poofoEl.classList.remove('hidden');

  const btn = document.createElement('button');
  btn.className = 'poofo-btn';
  const btnLabel = document.createElement('span');
  btnLabel.textContent = 'Consult the local Poofo';
  const btnIcon = document.createElement('span');
  btnIcon.className = 'poofo-icon';
  btnIcon.innerHTML = POOFO_ICON_SVG;
  btn.appendChild(btnLabel);
  btn.appendChild(btnIcon);

  const hintText = document.createElement('p');
  hintText.className = 'poofo-hint';

  btn.addEventListener('click', () => {
    const hint = pickWeighted(POOFO_HINTS, h => h.weight || 1);
    const correct = getCorrectChoice(location);
    const isAccurate = Math.random() < hint.accuracy;

    let highlighted = correct;
    if (!isAccurate) {
      const others = location.choices.filter(c => c !== correct);
      if (others.length > 0) highlighted = others[randomInt(0, others.length - 1)];
    }

    hintText.textContent = hint.text;
    buttonMap.forEach(buttonEl => {
      buttonEl.classList.remove('poofo-highlight');
      const existingIcon = buttonEl.querySelector('.poofo-icon');
      if (existingIcon) existingIcon.remove();
    });
    const targetBtn = buttonMap.get(highlighted);
    if (targetBtn) {
      targetBtn.classList.add('poofo-highlight');
      const icon = document.createElement('span');
      icon.className = 'poofo-icon';
      icon.innerHTML = POOFO_ICON_SVG;
      targetBtn.appendChild(icon);
    }
    btn.disabled = true;
  });

  poofoEl.appendChild(btn);
  poofoEl.appendChild(hintText);
}

// Draws a tick on the progress bar at the start of each zone after the
// first (zone boundaries never move, so this only needs to run once).
function renderZoneMarkers() {
  const markersEl = document.getElementById('zone-markers');
  markersEl.innerHTML = '';
  ZONES.slice(1).forEach(zone => {
    const marker = document.createElement('div');
    marker.className = 'zone-marker';
    marker.style.left = (zone.min / CONFIG.winDistance) * 100 + '%';
    marker.title = `${zone.name} begins`;
    markersEl.appendChild(marker);
  });
}

function updateHud() {
  const pct = Math.min(100, (state.progress / CONFIG.winDistance) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';

  const penaltyEl = document.getElementById('penalty-points');
  penaltyEl.innerHTML = '';
  for (let i = 0; i < CONFIG.maxPenaltyPoints; i++) {
    const span = document.createElement('span');
    span.textContent = '✗';
    span.className = i < state.penaltyPoints ? 'penalty-mark-full' : 'penalty-mark-empty';
    penaltyEl.appendChild(span);
  }
}

renderZoneMarkers();
newGame();
</script>
</body>
</html>
